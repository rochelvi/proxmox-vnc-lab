<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Консоль ВМ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="console-page">
  <main class="container">
    <header><h1 id="title">Консоль</h1><a href="/">← К списку ВМ</a></header>
    <p id="status">Подключение…</p>
    <div id="screen"></div>
  </main>
  <script type="module">
    (async () => {
      const token = sessionStorage.getItem("token");
      const vmid = new URLSearchParams(location.search).get("vmid");
      if (!token || !vmid) {
        location.href = "/login.html";
        return;
      }
      const status = document.querySelector("#status");
      try {
        const {default: RFB} = await import(
          "https://cdn.jsdelivr.net/gh/novnc/noVNC@v1.6.0/core/rfb.js"
        );
        const auth = {"Authorization": `Bearer ${token}`};
        const response = await fetch(`/api/vms/${vmid}/vnc`, {headers: auth});
        if (!response.ok) throw new Error(`VNC API returned ${response.status}`);
        const info = await response.json();
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const rfb = new RFB(document.querySelector("#screen"),
          `${scheme}://${location.host}${info.ws_path}?port=${info.port}&vncticket=${encodeURIComponent(info.ticket)}&token=${encodeURIComponent(token)}`,
          {credentials: {password: info.password}});
        rfb.scaleViewport = true;
        rfb.addEventListener("connect", () => { status.textContent = "Подключено"; });
        rfb.addEventListener("disconnect", () => { status.textContent = "Соединение закрыто"; });
      } catch (error) {
        console.error("VNC console failed", error);
        status.textContent = "Не удалось загрузить консоль. Проверьте доступ к Proxmox.";
      }
    })();
  </script>
</body>
</html>
