<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Консоль ВМ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="console-page">
  <main class="container">
    <header><h1 id="title">Консоль</h1><a href="/">← К списку ВМ</a></header>
    <p id="status">Подключение…</p>
    <div id="screen"></div>
  </main>
  <script type="module">
    import RFB from "https://cdn.jsdelivr.net/npm/@novnc/novnc@1.6.0/lib/rfb.js";
    const token = sessionStorage.getItem("token");
    const vmid = new URLSearchParams(location.search).get("vmid");
    const status = document.querySelector("#status");
    if (!token || !vmid) location.href = "/login.html";
    const auth = {"Authorization": `Bearer ${token}`};
    const response = await fetch(`/api/vms/${vmid}/vnc`, {headers: auth});
    if (!response.ok) { status.textContent = "Не удалось получить доступ к консоли"; throw new Error("VNC setup failed"); }
    const info = await response.json();
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const rfb = new RFB(document.querySelector("#screen"),
      `${scheme}://${location.host}${info.ws_path}?port=${info.port}&vncticket=${encodeURIComponent(info.ticket)}&token=${encodeURIComponent(token)}`,
      {credentials: {password: info.password}});
    rfb.scaleViewport = true;
    rfb.addEventListener("connect", () => { status.textContent = "Подключено"; });
    rfb.addEventListener("disconnect", () => { status.textContent = "Соединение закрыто"; });
  </script>
</body>
</html>
