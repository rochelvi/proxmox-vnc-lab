<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxmox VNC Lab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Мои виртуальные машины</h1>
      <div class="actions">
        <button data-theme-toggle class="secondary">Тёмная тема</button>
        <button id="change-password" class="secondary" hidden>Изменить пароль</button>
        <button id="logout" class="secondary">Выйти</button>
      </div>
    </header>
    <p id="message"></p>
    <div class="vm-controls">
      <label id="template-picker">Шаблон
        <select id="template-select"></select>
      </label>
      <button id="get-vm">Получить ВМ</button>
    </div>
    <table><thead><tr><th>VMID</th><th>Имя</th><th>Шаблон</th><th>Статус</th><th>Действия</th></tr></thead>
      <tbody id="vms"></tbody>
    </table>
  </main>

  <div id="vm-loading-overlay" class="overlay" hidden>
    <div class="card narrow loading-card">
      <div class="spinner"></div>
      <h2>Создание виртуальной машины</h2>
      <p class="loading-subtitle">Идет развертывание и запуск виртуальной машины.<br>Пожалуйста, подождите, это может занять несколько минут.</p>
      <div class="progress-bar">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>

  <div id="password-overlay" class="overlay" hidden>
    <form id="password-form" class="card narrow dialog-card">
      <h2>Изменить пароль</h2>
      <label>Текущий пароль<input name="current_password" type="password" required autocomplete="current-password"></label>
      <label>Новый пароль<input name="new_password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label>Повторите новый пароль<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
      <p id="password-message"></p>
      <div class="dialog-actions">
        <button type="button" id="password-cancel" class="secondary">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
