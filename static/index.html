<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxmox VNC Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header><h1>Мои виртуальные машины</h1><button id="logout" class="secondary">Выйти</button></header>
    <p id="message"></p>
    <div class="vm-controls">
      <label id="template-picker">Шаблон
        <select id="template-select"></select>
      </label>
      <button id="get-vm">Получить ВМ</button>
    </div>
    <table><thead><tr><th>VMID</th><th>Имя</th><th>Шаблон</th><th>Статус</th><th>Действия</th></tr></thead>
      <tbody id="vms"></tbody>
    </table>
  </main>

  <div id="vm-loading-overlay" class="loading-overlay" hidden>
    <div class="card narrow loading-card">
      <div class="spinner"></div>
      <h2>Создание виртуальной машины</h2>
      <p class="loading-subtitle">Идет развертывание и запуск виртуальной машины.<br>Пожалуйста, подождите, это может занять несколько минут.</p>
      <div class="progress-bar">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
